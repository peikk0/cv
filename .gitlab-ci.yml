---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

  - project: renovate-bot/renovate-runner
    file: /templates/renovate-config-validator.gitlab-ci.yml

stages:
  - test
  - build
  - deploy

.build:
  stage: build
  image:
    name: ghcr.io/puppeteer/puppeteer:25.16.0@sha256:956a72e3d523c76606efaad23392fbe33950370189f749715222c7427f57392b
    entrypoint: [""]
  variables:
    PUPPETEER_SKIP_DOWNLOAD: "true"
    THEME: jsonresume-theme-even
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - npx resumed validate resume.json
    - npx resumed render resume.json --theme "${THEME}" --output resume.html
    - npx resumed export resume.json --theme "${THEME}" --output resume.pdf
  artifacts:
    paths:
      - resume.html
      - resume.pdf

# Merge requests

build:mr:
  extends: .build
  artifacts:
    expire_in: 1 week
    expose_as: generated cv
    paths:
      - resume.html
      - resume.pdf
  only:
    - merge_requests

# Default branch

build:
  extends: .build
  only:
    - main

pages:
  stage: deploy
  image: alpine:latest@sha256:71e9b7bae160ba167fa17414401b94cbcdaf3c32feeab9298bd794a2a0614c35
  needs:
    - build
  script:
    - mkdir -p public
    - cp resume.html public/index.html
    - cp resume.pdf public/resume.pdf
  pages: true
  publish: public
  environment:
    name: pages
    url: https://pierre.guinoiseau.nz
  artifacts:
    paths:
      - public
  only:
    - main
