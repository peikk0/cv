---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

  - project: renovate-bot/renovate-runner
    file: /templates/renovate-config-validator.gitlab-ci.yml

stages:
  - test
  - build
  - deploy
  - release

.build:
  stage: build
  image:
    name: ghcr.io/puppeteer/puppeteer:25.5.0
    entrypoint: [""]
  variables:
    PUPPETEER_SKIP_DOWNLOAD: "true"
    THEME: jsonresume-theme-even
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - npx resumed validate resume.json
    - npx resumed render resume.json --theme "${THEME}" --output resume.html
    - npx resumed export resume.json --theme "${THEME}" --output resume.pdf
  artifacts:
    paths:
      - resume.html
      - resume.pdf

# Merge requests

ci:build:cv:
  extends: .build
  artifacts:
    expire_in: 1 week
    expose_as: generated cv
    paths:
      - resume.html
      - resume.pdf
  only:
    - merge_requests

# Default branch

build:cv:default:
  extends: .build
  only:
    - main

pages:
  stage: deploy
  image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  needs:
    - build:cv:default
  script:
    - mkdir -p public
    - cp resume.html public/index.html
    - cp resume.pdf public/resume.pdf
  pages: true
  publish: public
  environment:
    name: pages
    url: https://pierre.guinoiseau.nz
  artifacts:
    paths:
      - public
  only:
    - main

# Tags / releases

build:cv:
  extends: .build
  only:
    - tags

release:
  stage: release
  image: python:3@sha256:3a9d2dd3f18e5c7a9d8de7b3659418a4ab848ccd409fb9e91ef9d7a6a3520ba7
  needs:
    - build:cv
  script:
    - pip3 install gitlab-release
    - gitlab-release --link-artifact resume.html resume.pdf
  artifacts:
    paths:
      - resume.html
      - resume.pdf
  only:
    - tags
